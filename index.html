<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEBT BOOK</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#ffe6f2;
      min-height:100vh;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    .title{
      text-align:center;
      font-size:42px;
      color:#0066ff;
      margin-bottom:25px;
      font-weight:bold;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:25px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      margin-bottom:25px;
    }

    .card h2{
      margin-bottom:15px;
      color:#333;
    }

    input{
      width:100%;
      padding:15px;
      border-radius:15px;
      border:2px solid #ddd;
      margin-top:12px;
      font-size:16px;
      outline:none;
    }

    input:focus{
      border-color:#0066ff;
    }

    .add-btn{
      width:100%;
      padding:15px;
      border:none;
      background:#0066ff;
      color:white;
      border-radius:15px;
      margin-top:15px;
      font-size:17px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    .add-btn:hover{
      background:#0052cc;
      transform:scale(1.02);
    }

    .DEBT-list{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .DEBT-item{
      background:white;
      border-radius:20px;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      box-shadow:0 5px 10px rgba(0,0,0,0.08);
      border-left:10px solid #0066ff;
    }

    .DEBT-info h3{
      font-size:24px;
      color:#333;
      margin-bottom:8px;
    }

    .DEBT-info p{
      font-size:20px;
      color:#666;
      font-weight:bold;
    }

    .warning{
      color:red;
      margin-top:8px;
      font-weight:bold;
      font-size:15px;
    }

    .buttons{
      display:flex;
      gap:10px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .paid-btn{
      background:#00b894;
      color:white;
      border:none;
      padding:12px 18px;
      border-radius:12px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }

    .delete-btn{
      background:#ff4d4d;
      color:white;
      border:none;
      padding:12px 18px;
      border-radius:12px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }

    .paid-btn:hover,
    .delete-btn:hover{
      transform:scale(1.05);
    }

    .empty{
      text-align:center;
      color:#777;
      margin-top:20px;
      font-size:20px;
    }

    @media(max-width:700px){

      .DELETE-item{
        flex-direction:column;
        align-items:flex-start;
      }

      .buttons{
        width:100%;
      }

      .buttons button{
        flex:1;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <div class="title">
      📒 DEBT BOOK
    </div>

    <div class="card">

      <h2>ADD</h2>

      <input 
        type="text" 
        id="NAME" 
        placeholder="Masukkan nama pembeli"
      >

      <input 
        type="number" 
        id="TOTAL" 
        placeholder="INSERT TOTAL DEBT"
      >

      <button class="add-btn" onclick="ADD()">
        ADD
      </button>

    </div>

    <div class="DEBT-list" id="DEBTList"></div>

  </div>

<script>

  let DEBTData =
    JSON.parse(localStorage.getItem("hutangData")) || [];

  function saveData(){

    localStorage.setItem(
      "DEBTData",
      JSON.stringify(hutangData)
    );

  }

  function speak(text){

    let speech =
      new SpeechSynthesisUtterance(text);

    speech.lang = "ms-MY";
    speech.volume = 1;
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);

  }

  function vibratePhone(){

    if(navigator.vibrate){

      navigator.vibrate([
        300,
        200,
        300,
        200,
        500
      ]);

    }

  }

  function ADD (){

    let NAME =
      document.getElementById("nama")
      .value
      .trim();

    let TOTAL =
      parseFloat(
        document.getElementById("jumlah").value
      );

    if(NAME === "" || isNaN(TOTAL)){

      alert("PLEASE ENTER NAME AMOUNT!");

      return;

    }

    let existingPerson =
      DEBTData.find(
        item =>
        item.NAME.toLowerCase() ===
        NAME.toLowerCase()
      );

    if(existingPerson){

      existingPerson.NAME += TOTAL;

      speak(
        NAME +
        " NEW AMOUNT RM " +
        existingPerson.hutang
      );

      if(existingPerson.hutang >= 50){

        alert(
          "⚠️ “Limit exceeded”!"
        );

        vibratePhone();

        speak(
          "Warning: Buyer’s debt is over the limit"
        );

      }

    }

    else{

      DEBTData.push({

        NAME:NAME,
        DEBT:TOTAL

      });

      speak(
        NAME +
        " DEBT RM " +
        TOTAL
      );

      if(TOTAL >= 50){

        alert(
          "⚠️ “Limit exceeded!"
        );

        vibratePhone();

        speak(
          "Warning: Buyer’s debt is over the limit"
        );

      }

    }

    saveData();

    displayData();

    document.getElementById("NAME").value = "";
    document.getElementById("TOTAL").value = "";

  }

  function PAID(index){

    let NAME = DEBTData[index].NAME;

    speak(
      NAME +
      " PAYMENT COMPLETED"
    );

    DEBTData.splice(index,1);

    saveData();

    displayData();

  }

  function DELETE(index){

    DEBTData.splice(index,1);

    saveData();

    displayData();

  }

  function displayData(){

    let DEBTList =
      document.getElementById("DEBTList");

    DEBTList.innerHTML = "";

    if(DEBTData.length === 0){

      DEBTList.innerHTML =
      `
        <div class="empty">
        No debt remaining 🎉
        </div>
      `;

      return;

    }

  DEBTData.forEach((item,index)=>{

      let warningText = "";

      if(item.DEBT >= 50){

        warningText =
        `
          <div class="warning">
            ⚠️“Limit exceeded”!
          </div>
        `;

      }

      DEBTList.innerHTML +=
      `

      <div class="DEBT-item">

        <div class="DEBT-info">

          <h3>
            ${item.NAME}
          </h3>

          <p>
           DEBT: RM${item.DEBT.toFixed(2)}
          </p>

          ${warningText}

        </div>

        <div class="buttons">

          <button
            class="paid-btn"
            onclick="PAY(${index})"
          >
            ✅"Payment Completed"
          </button>

          <button
            class="delete-btn"
            onclick="DELETE(${index})"
          >
            ❌DELETE
          </button>

        </div>

      </div>

      `;

    });

  }

  displayData();

</script>

</body>
</html>
